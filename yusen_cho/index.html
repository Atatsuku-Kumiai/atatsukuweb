<!DOCTYPE html>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
html, body { margin:0; padding:0; height:100%; overflow-y:auto; font-family:sans-serif; }

/* 画面上部タイトル */
h1{text-align:center;margin:10px 0;}

/* 上段（マップ＋右チャート）ラップ */
#topArea{
  display:flex;
  flex-wrap:wrap;    /* 画面幅が狭いとき縦並びに崩れる */
  gap:10px;
  padding:10px;
  align-items:flex-start;  /* 追加：高さ揃えない → マップ縮小でも押し上げない */
}

/* 左側：マップ */
#map{
  flex: 1 1 50%;     /* 通常は50%幅、縮んだら可変 */
  max-width:100%;
  height:auto;
  background:#fff;
  border:none;
  /* 追加 ↓ */
  max-height: 90vh;   /* 画面の高さ以内に収める */
  object-fit: cover;
  display:block /* 追加！これが重要 */
}

/* 右側：市町村クリック時の棒グラフ */
#chart-container{
  flex:1 1 45%;
  min-width:300px;
  padding:10px;
  box-sizing:border-box;
  border:none;
  height:65vh;   /* ← これを追加（例：高さを画面の70%） */
}

text { font-size:32px; pointer-events:none; }
.box { 
  stroke:#555; 
  stroke-width:2; 
  rx:16; 
  ry:16; 
  cursor:pointer;
  pointer-events:auto;
}
#total-label{text-align:center;font-weight:bold;margin-top:6px;}

@media (max-width:900px){
  #topArea{
    flex-direction:column; /* スマホ等では縦配置 */
  }
  #map, #chart-container{
    width:100%;
    height:auto;          /* ← 高さ自動調整、これが無いと無限に伸びる */
  }
  #chart-container{
    padding-top: 5px;       /* ← 上余白を縮小 */
    margin-top: 0;
  }
  #chart{
    height:400px !important; /* ← キャンバスの実高さを確保（伸び防止） */
  }
  #chart-title{
    margin-top: 0;
  }
}

/* ▼ Chart.jsが高さを引き伸ばさないようにする */
#rankingChart{
  max-height:600px;        /* heightではなく max-height に変更 */
}
#chart{
  flex:1;
  /* max-height:90vh;         画面の高さ以内に収める */
  object-fit: contain;
}

/* グラフ中央上に重ねるタイトル */
#chart-title{font-size:20px;font-weight:bold;margin-bottom:5px;text-align:center;}

/* ▼ ランキングセクションをフレックス外で正しく下に配置 */
#rankingSection{
  width:100%;
  display:block;
  margin-top:50px;
}

/* ▼ ランキングチャートの幅を少し縮める */
#rankingChart {
  width: 90% !important;   /* ← 100%より少し狭く */
  max-width: 950px;        /* 広すぎないよう上限設定 */
  margin: 0 auto;          /* 中央寄せ */
  display: block;
}
</style>
</head>
